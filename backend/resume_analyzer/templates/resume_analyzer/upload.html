
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume | PrepWise AI</title>
</head>
<body>
    <h1>ResumeIQ</h1>
    <p>Upload your resume to begin your career-readiness analysis.</p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload Resume</button>
    </form>

    <p><a href="{% url 'dashboard' %}">Back to Dashboard</a></p>
</body>
</html>
