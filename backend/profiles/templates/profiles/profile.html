<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - PrepWise AI</title>
</head>

<body>

    <h1>My PrepWise AI Profile</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Full Name</label>
        <input
            type="text"
            name="full_name"
            value="{{ profile.full_name }}"
            required
        >

        <br><br>

        <label>Education</label>
        <input
            type="text"
            name="education"
            value="{{ profile.education }}"
        >

        <br><br>

        <label>Skills</label>
        <textarea name="skills">{{ profile.skills }}</textarea>

        <br><br>

        <label>Experience Level</label>

        <select name="experience_level">

            <option value="fresher"
                {% if profile.experience_level == 'fresher' %}selected{% endif %}>
                Fresher
            </option>

            <option value="beginner"
                {% if profile.experience_level == 'beginner' %}selected{% endif %}>
                Beginner
            </option>

            <option value="intermediate"
                {% if profile.experience_level == 'intermediate' %}selected{% endif %}>
                Intermediate
            </option>

            <option value="experienced"
                {% if profile.experience_level == 'experienced' %}selected{% endif %}>
                Experienced
            </option>

        </select>

        <br><br>

        <label>Target Role</label>
        <input
            type="text"
            name="target_role"
            value="{{ profile.target_role }}"
        >

        <br><br>

        <label>Bio</label>
        <textarea name="bio">{{ profile.bio }}</textarea>

        <br><br>

        <button type="submit">Save Profile</button>

    </form>

</body>
</html>
