<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Interview - PrepWise AI</title>
</head>

<body>

    <h1>Start Your Interview</h1>

    <p>
        Choose your interview preferences before starting.
    </p>

    <form method="POST">
        {% csrf_token %}

        <label for="interview_type">Interview Type</label>
        <br>

        <select name="interview_type" id="interview_type" required>
            <option value="">Select interview type</option>
            <option value="technical">Technical</option>
            <option value="hr">HR</option>
            <option value="behavioral">Behavioral</option>
            <option value="mixed">Mixed</option>
        </select>

        <br><br>

        <label for="target_role">Target Role</label>
        <br>

        <input
            type="text"
            name="target_role"
            id="target_role"
            placeholder="e.g. Full Stack Developer"
            required
        >

        <br><br>

        <label for="difficulty">Difficulty</label>
        <br>

        <select name="difficulty" id="difficulty" required>
            <option value="">Select difficulty</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>

        <br><br>

        <button type="submit">Start Interview</button>

    </form>

    <br>

    <a href="{% url 'dashboard' %}">Back to Dashboard</a>

</body>
</html>
